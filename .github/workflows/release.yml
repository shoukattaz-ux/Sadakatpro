# Builds the Windows app + installer and publishes a GitHub Release.
# Publish an update:  bump flowpilot/__init__.py __version__, add a CHANGELOG entry, commit, then EITHER
#   - GitHub → Actions → Release → "Run workflow"   (creates the tag v<version> itself), OR
#   - git tag v0.3.0 && git push origin v0.3.0
# Installed copies of FlowPilot find the new release and update themselves.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      FLOWPILOT_NO_KEYRING: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pytest-asyncio

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $code = (python -c "import flowpilot; print(flowpilot.__version__)").Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
            if ($tag -ne $code) { throw "Tag v$tag does not match flowpilot.__version__ ($code)" }
          }
          "version=$code" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: python -m pytest -q

      - name: Build FlowPilot.exe
        run: pyinstaller flowpilot.spec --noconfirm

      - name: Self-check the built app (UI + real browser)
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\smoke.txt"
          $p = Start-Process -FilePath "dist\FlowPilot\FlowPilot.exe" -ArgumentList "--smoke-test","--with-browser","--smoke-report",$report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Smoke test failed (exit $($p.ExitCode))" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\flowpilot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Checksums and portable zip
        shell: pwsh
        run: |
          $out = "dist\installer"
          $hash = (Get-FileHash "$out\FlowPilot-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  FlowPilot-Setup.exe" | Out-File -Encoding ascii "$out\FlowPilot-Setup.exe.sha256"
          Compress-Archive -Path "dist\FlowPilot\*" -DestinationPath "$out\FlowPilot-portable.zip"
          python tools/release_notes.py "${{ steps.ver.outputs.version }}" "$out\release-notes.md"
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: FlowPilot-${{ steps.ver.outputs.version }}
          path: dist/installer/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FlowPilot ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: dist/installer/release-notes.md
          files: |
            dist/installer/FlowPilot-Setup.exe
            dist/installer/FlowPilot-Setup.exe.sha256
            dist/installer/release-notes.md
            dist/installer/FlowPilot-portable.zip
