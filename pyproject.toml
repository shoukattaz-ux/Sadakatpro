[project]
name = "flowpilot"
version = "0.1.0"
description = "FlowPilot - no-code browser automation studio for anti-detect browser profiles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "qasync>=0.27",
    "playwright>=1.44",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "loguru>=0.7",
    "keyring>=24",
    "cryptography>=42",
    "APScheduler>=3.10,<4",
    "psutil>=5.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6"]

[project.scripts]
flowpilot = "flowpilot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowpilot*"]

[tool.setuptools.package-data]
flowpilot = ["resources/**/*", "core/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
